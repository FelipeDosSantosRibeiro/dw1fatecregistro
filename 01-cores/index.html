<!DOCTYPE html>
<html lang="bt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducao ao bootstrap - cores</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <main>
        <section>
            <h1>Cores no bootstrap</h1>
            <div>
                <p class="h3 text-muted">Classe text-muted</p>
                <p class="h3 text-primary">Classe text-primary</p>
                <p class="h3 text-success">Classe text-success</p>
                <p class="h3 text-info">class text-info</p>
                <p class="h3 text-warning">Class text-warning</p>
                <p class="h3 text-danger">Class text-danger</p>
                <p class="h3 text-secondary">class text-secondary</p>
            </div>
        </section>
        <h1>Botões no bootstrap</h1>
        <button type="button" class="btn">Normal</button><br><br>
        <button type="button" class="btn btn-primary">primario</button><br><br>
        <button type="button" class="btn btn-secondary">secondario</button><br><br>
        <button type="button" class="btn btn-success">sucesso</button><br><br>
        <button type="button" class="btn btn-info">informacao</button><br><br>
        <button type="button" class="btn btn-warning">alerta</button><br><br>
        <button type="button" class="btn btn-danger">perigo</button><br><br>
        <button type="button" class="btn btn-dark">dark</button><br><br>
        <button type="button" class="btn btn-light">light</button><br><br>
        <button type="button" class="btn btn-link">link</button><br><br>
        <button type="button" class="btn btn-outline-danger">alerta outline</button><br><br>
        <button type="button" class="btn btn-outline-primary">primario outline</button><br><br>
        <button type="button" class="btn btn-outline-success btn-lg">enviar</button><br><br>




    </main>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
 integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

 </html>
