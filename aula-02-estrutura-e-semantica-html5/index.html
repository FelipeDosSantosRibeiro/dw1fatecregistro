<!-- estrutura basica do html -->
<!doctype html>
<!-- diz ao navegador para utilizar a ultima versao do html  -->
<html lang="pt-br">
  <!-- atrubuto lang informa o idioma  -->
  <head>
    <!-- charset indica o conjunto de caracteres / shift+alt+f=prettier formatacao-->
    <meta charset="UTF-8" />
    <!-- permite apresentar uma melhor visualisacao em dispositivos moveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- titulo exibido na barra do navegador -->
    <title>meu website</title>
  </head>
  <!-- conteudo do site de fato ,que o usuario ira visualizar -->
  <body>
    <h1>meu site</h1>
    <p>bem vindo ao meu site!</p>
  </body>
</html>
